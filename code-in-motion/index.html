<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Code in Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: one brushed-metal device, centred. Dark screen on top, speaker-style chin
   with controls, then a row: [prev] [short explanation] [next]. */
:root{
  --page:#d9dfe7; --ink:#131a26; --muted:#41506a; --accent:#0a54a8;
  --m1:#f3f5f8; --m2:#bcc5d0; --m3:#e9edf2; --m4:#9ba6b4; --m5:#d3d9e1;
  --brush:rgba(20,30,50,.045); --edge:#7a8594; --screw:#7f8997;
  --hi:rgba(255,255,255,.85); --lo:rgba(10,20,40,.28);
  --knob-a:#fbfcfd; --knob-b:#b3bcc9; --knob-ink:#1b2638;
  --dot:#8a95a6; --led:#17a34a; --led-off:#d98a0b;
  --lcd-bg:#0d1527; --lcd-ink:#8de7c4;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d1016; --ink:#e7ecf5; --muted:#9eaac0; --accent:#6db6ff;
    --m1:#4b5361; --m2:#2b313b; --m3:#434b58; --m4:#222730; --m5:#3a4250;
    --brush:rgba(255,255,255,.035); --edge:#05070a; --screw:#161a21;
    --hi:rgba(255,255,255,.16); --lo:rgba(0,0,0,.6);
    --knob-a:#555e6e; --knob-b:#2a303a; --knob-ink:#e6ecf6;
    --dot:#586377; --led:#35d07f; --led-off:#f0a229;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d1016; --ink:#e7ecf5; --muted:#9eaac0; --accent:#6db6ff;
  --m1:#4b5361; --m2:#2b313b; --m3:#434b58; --m4:#222730; --m5:#3a4250;
  --brush:rgba(255,255,255,.035); --edge:#05070a; --screw:#161a21;
  --hi:rgba(255,255,255,.16); --lo:rgba(0,0,0,.6);
  --knob-a:#555e6e; --knob-b:#2a303a; --knob-ink:#e6ecf6;
  --dot:#586377; --led:#35d07f; --led-off:#f0a229;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--page); color:var(--ink);
  font:400 15px/1.4 var(--font);
  padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* ---- the metal device ---- */
.device{
  position:relative; border-radius:24px; padding:12px 12px 6px;
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
  background:
    radial-gradient(circle at 9px 9px,var(--screw) 0 2.6px,transparent 3.2px),
    radial-gradient(circle at calc(100% - 9px) 9px,var(--screw) 0 2.6px,transparent 3.2px),
    radial-gradient(circle at 9px calc(100% - 9px),var(--screw) 0 2.6px,transparent 3.2px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--screw) 0 2.6px,transparent 3.2px),
    repeating-linear-gradient(90deg,var(--brush) 0 1px,transparent 1px 3px),
    linear-gradient(150deg,var(--m1) 0%,var(--m2) 26%,var(--m3) 50%,var(--m4) 74%,var(--m5) 100%);
  box-shadow:
    inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo),
    0 0 0 1px var(--edge), 0 14px 28px -12px rgba(10,20,40,.55);
}
.screen{
  width:min(100%,max(270px,calc((100svh - 292px) * .9)));
  aspect-ratio:9/10; margin-inline:auto;
  border-radius:14px; overflow:hidden; background:#0a0f1c;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.65), 0 0 0 1px var(--lo), 0 1px 0 1px var(--hi);
  cursor:pointer;
}
canvas{display:block;width:100%;height:100%}
.chin{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 4px}
.lcd{
  display:flex;align-items:center;gap:8px;
  background:var(--lcd-bg);color:var(--lcd-ink);
  border-radius:8px;padding:6px 10px;
  font:500 14px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.7), 0 1px 0 var(--hi);
}
.led{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led);animation:pulse 2s ease-in-out infinite}
.paused .led{background:var(--led-off);box-shadow:0 0 6px var(--led-off);animation:none}
@keyframes pulse{50%{opacity:.45}}
.tools{display:flex;gap:8px}

.knob{
  display:grid;place-items:center;padding:0;cursor:pointer;color:var(--knob-ink);
  border-radius:50%;border:1px solid var(--edge);
  background:linear-gradient(160deg,var(--knob-a),var(--knob-b));
  box-shadow:inset 0 1px 0 var(--hi),0 3px 6px -2px rgba(10,20,40,.5);
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s ease,box-shadow .08s ease;
}
.knob:active{transform:translateY(1px) scale(.97);box-shadow:inset 0 2px 4px var(--lo)}
.knob:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.knob svg{display:block}
.mini{width:44px;height:44px}
.big{width:58px;height:58px}

/* ---- progress dots ---- */
.dots{display:flex;justify-content:center;flex-wrap:wrap}
.dot{width:21px;height:24px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dot::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--dot);transition:width .25s ease,background .25s ease}
.dot[aria-current="true"]::before{width:17px;background:var(--accent)}

/* ---- [prev] [explanation] [next] ---- */
.nav{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:10px;align-items:center}
.info{min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:center}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.info h1{margin:0;font-size:23px;line-height:1.1;font-weight:700;text-wrap:balance}
.info p{margin:0;font-size:15px;line-height:1.35;color:var(--muted);text-wrap:balance}
.hint{margin:0;text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.led{animation:none}.knob,.dot::before{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="device" id="device" aria-label="Animation player">
    <div class="screen" id="screenWrap">
      <canvas id="screen" role="img" aria-label="Animation"></canvas>
    </div>
    <div class="chin">
      <div class="lcd"><span class="led"></span><span id="count">01 / 15</span></div>
      <div class="tools">
        <button class="knob mini" id="replay" type="button" aria-label="Replay animation">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="knob mini" id="pp" type="button" aria-label="Pause animation">
          <svg id="icoPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          <svg id="icoPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div class="dots" id="dots" role="group" aria-label="Choose an animation"></div>

  <section class="nav" aria-label="Lesson navigation">
    <button class="knob big" id="prev" type="button" aria-label="Previous animation">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="info" aria-live="polite">
      <span class="kicker" id="kicker"></span>
      <h1 id="title"></h1>
      <p id="text"></p>
    </div>
    <button class="knob big" id="next" type="button" aria-label="Next animation">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>
  <p class="hint">Tap the screen to pause. Swipe left or right to change.</p>
</div>

<script>
(() => {
'use strict';

/* ================= canvas setup ================= */
const W = 360, H = 400;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
let sx = 1;

const C = {
  bg:'#0a0f1c', ink:'#eaf0ff', mute:'#8d9bc0', line:'#35416b', panel:'#13203d',
  cyan:'#4cc9f0', green:'#4ade80', amber:'#fbbf24', pink:'#f472b6', red:'#fb7185',
  violet:'#a78bfa', orange:'#fb923c', blue:'#60a5fa'
};
const SANS = '"Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

/* ================= math ================= */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const back = t => { t = clamp(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rnd = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (c1, c2, t) => { const a = rgb(c1), b = rgb(c2); return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')'; };
const rgba = (c, a) => 'rgba(' + rgb(c).join(',') + ',' + a + ')';
function h16(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return ((h >>> 0) & 0xffff).toString(16).padStart(4, '0'); }

/* ================= drawing helpers ================= */
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function box(x, y, w, h, o = {}) {
  const { fill, stroke, r = 10, lw = 2, a = 1, dash } = o;
  ctx.globalAlpha = a; rrect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); }
  ctx.globalAlpha = 1;
}
const cbox = (cx, cy, w, h, o) => box(cx - w / 2, cy - h / 2, w, h, o);
function circ(x, y, r, o = {}) {
  const { fill, stroke, lw = 2, a = 1, dash } = o;
  ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); }
  ctx.globalAlpha = 1;
}
function ln(x1, y1, x2, y2, color, lw = 2, o = {}) {
  ctx.globalAlpha = o.a == null ? 1 : o.a; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.setLineDash(o.dash || []); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function arrow(x1, y1, x2, y2, color, lw = 3, a = 1) {
  const ang = Math.atan2(y2 - y1, x2 - x1), hl = lw * 3 + 5;
  ln(x1, y1, x2 - Math.cos(ang) * hl * .6, y2 - Math.sin(ang) * hl * .6, color, lw, { a });
  ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl * Math.cos(ang - .45), y2 - hl * Math.sin(ang - .45));
  ctx.lineTo(x2 - hl * Math.cos(ang + .45), y2 - hl * Math.sin(ang + .45));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1;
}
function tri(x, y, s, fill, a = 1) {
  ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(x - s, y - s * .8); ctx.lineTo(x + s, y - s * .8); ctx.lineTo(x, y + s * .8);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.globalAlpha = 1;
}
function txt(s, x, y, o = {}) {
  const { size = 14, color = C.ink, align = 'center', weight = 700, mono = false, a = 1 } = o;
  ctx.globalAlpha = a; ctx.fillStyle = color;
  ctx.font = Math.min(700, weight) + ' ' + size + 'px ' + (mono ? MONO : SANS);
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function chip(s, cx, cy, fill, o = {}) {
  const { size = 14, color = '#0a0f1c', a = 1, h = size + 16, stroke, padX = 14 } = o;
  ctx.font = '700 ' + size + 'px ' + SANS;
  const w = ctx.measureText(s).width + padX * 2;
  cbox(cx, cy, w, h, { fill, stroke, lw: 2, r: h / 2, a });
  txt(s, cx, cy + .5, { size, color, a });
  return w;
}
function scaled(cx, cy, s, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function glow(x, y, r, color, a = .5) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, 1)); g.addColorStop(1, rgba(color, 0));
  ctx.globalAlpha = clamp(a); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
}
function cyl(cx, cy, w, h, o = {}) {
  const { fill = C.panel, stroke = C.mute, lw = 2.5 } = o, rx = w / 2, ry = 13, top = cy - h / 2 + ry, bot = cy + h / 2 - ry;
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(cx - rx, top); ctx.lineTo(cx - rx, bot); ctx.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(cx + rx, top); ctx.ellipse(cx, top, rx, ry, 0, 0, Math.PI, true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, top, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
}
function padlock(x, y, col) {
  box(x - 10, y - 1, 20, 16, { fill: col, r: 3 });
  ctx.beginPath(); ctx.arc(x, y - 1, 6, Math.PI, 0); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
}
function crown(x, y, col) {
  ctx.beginPath(); ctx.moveTo(x - 12, y + 8); ctx.lineTo(x - 14, y - 8); ctx.lineTo(x - 6, y - 1); ctx.lineTo(x, y - 11);
  ctx.lineTo(x + 6, y - 1); ctx.lineTo(x + 14, y - 8); ctx.lineTo(x + 12, y + 8); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function wifi(x, y, col, off) {
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(x, y + 9, i * 6, -.75 * Math.PI, -.25 * Math.PI); ctx.stroke(); }
  circ(x, y + 9, 2.8, { fill: col });
  if (off) ln(x - 14, y - 8, x + 14, y + 16, C.red, 4);
}
function userIcon(x, y, col) {
  circ(x, y - 5, 6.5, { fill: col });
  ctx.beginPath(); ctx.arc(x, y + 14, 12, Math.PI, 0); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function edge(x1, y1, x2, y2, p, color, lw = 5) {
  if (p <= 0) return;
  const ym = (y1 + y2) / 2, n = 28; ctx.beginPath(); ctx.moveTo(x1, y1);
  for (let i = 1; i <= n; i++) {
    const u = p * i / n, v = 1 - u;
    ctx.lineTo(v * v * v * x1 + 3 * v * v * u * x1 + 3 * v * u * u * x2 + u * u * u * x2,
               v * v * v * y1 + 3 * v * v * u * ym + 3 * v * u * u * ym + u * u * u * y2);
  }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function caption(t, list) {
  let cur = null; for (const e of list) if (t >= e[0]) cur = e;
  if (!cur) return;
  const a = ease((t - cur[0]) / .3); let size = 15;
  ctx.font = '700 ' + size + 'px ' + SANS;
  while (ctx.measureText(cur[1]).width + 32 > 342 && size > 11) { size--; ctx.font = '700 ' + size + 'px ' + SANS; }
  const w = ctx.measureText(cur[1]).width + 32;
  cbox(180, 378, w, 30, { fill: 'rgba(255,255,255,0.09)', stroke: 'rgba(255,255,255,0.2)', lw: 1, r: 15, a });
  txt(cur[1], 180, 378.5, { size, a });
}

/* ================= the lessons ================= */
const S = [];

/* 1 ---------- Recursion ---------- */
S.push({
  kicker: 'Basics', title: 'Recursion',
  text: 'A function calls itself. Each call waits on the stack until the one above it answers.', L: 12,
  draw(t) {
    txt('3! = 3 × 2 × 1', 180, 30, { size: 19, color: C.mute });
    const base = 322, fh = 58, gap = 8, fx = 60, fw = 240;
    const F = [{ n: 3, push: .6, pop: 8.4, ret: 6 }, { n: 2, push: 2, pop: 6.6, ret: 2 }, { n: 1, push: 3.4, pop: 4.9, ret: 1 }];
    const yTop = i => base - (i + 1) * fh - i * gap;
    ln(fx - 14, base + 6, fx + fw + 14, base + 6, C.line, 4);
    txt('STACK', 180, base + 22, { size: 12, color: C.mute });
    F.forEach((f, i) => {
      const p = seg(t, f.push, f.push + .5), q = seg(t, f.pop, f.pop + .5);
      if (p <= 0 || q >= 1) return;
      const y0 = yTop(i), cy = y0 + fh / 2, dy = (1 - easeOut(p)) * -60, al = Math.min(1, p * 2) * (1 - q);
      const child = F[i + 1];
      const got = child ? t >= child.pop + .7 : t >= 4.3;
      const ret = t >= f.pop - .5;
      const stroke = (got && !child) || ret ? C.green : C.cyan;
      scaled(180, cy + dy, 1 - .12 * q, () => {
        box(fx, y0 + dy, fw, fh, { fill: C.panel, stroke, lw: ret ? 4 : 2.5, a: al });
        txt('fact(' + f.n + ')', fx + 18, cy + dy, { size: 21, align: 'left', mono: 1, a: al });
        let s, col = C.mute;
        if (!child) { s = got ? 'base case!' : '?'; col = got ? C.green : C.mute; }
        else { s = got ? f.n + ' × ' + child.ret + ' = ' + f.ret : f.n + ' × ?'; col = got ? C.amber : C.mute; }
        txt(s, fx + fw - 16, cy + dy, { size: 16, align: 'right', mono: 1, color: col, a: al });
      });
    });
    F.forEach((f, i) => {
      const u = seg(t, f.pop, f.pop + .7); if (u <= 0 || u >= 1) return;
      const e = ease(u), from = { x: fx + fw - 34, y: yTop(i) + fh / 2 };
      const to = i > 0 ? { x: fx + fw - 34, y: yTop(i - 1) + fh / 2 } : { x: 180, y: 84 };
      const x = lerp(from.x, to.x, e), y = lerp(from.y, to.y, e);
      circ(x, y, 16, { fill: C.amber }); txt(String(f.ret), x, y + 1, { size: 18, color: '#0a0f1c' });
    });
    const r = seg(t, 9.1, 9.6);
    if (r > 0) scaled(180, 84, back(r), () => txt('= 6', 180, 84, { size: 46, color: C.green }));
    caption(t, [[.3, '① Each call waits on the stack'], [4.3, '② Base case: the answer is 1'], [5.2, '③ Answers fly back down'], [9.1, '④ Done: 3! = 6']]);
  }
});

/* 2 ---------- Binary search ---------- */
S.push({
  kicker: 'Basics', title: 'Binary search',
  text: 'Check the middle, throw away half. A billion items need only about 30 looks.', L: 15,
  draw(t) {
    const vals = [4, 9, 13, 21, 27, 34, 40, 48, 55, 63, 72, 85], base = 290;
    const steps = [

(function () {

const $ = id => document.getElementById(id);
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx = 0, ct = 0, paused = reduce, fade = 1, last = performance.now();

const dotsEl = $('dots');
S.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'dot'; b.setAttribute('aria-label', (i + 1) + ': ' + s.title);
  b.addEventListener('click', () => go(i)); dotsEl.appendChild(b);
});

function syncPause() {
  $('app').classList.toggle('paused', paused);
  $('icoPause').toggleAttribute('hidden', paused); $('icoPlay').toggleAttribute('hidden', !paused);
  $('pp').setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
}
function go(i) {
  idx = (i + S.length) % S.length; const s = S[idx];
  ct = reduce ? s.L * .8 : 0; fade = 0;
  $('kicker').textContent = s.kicker; $('title').textContent = s.title; $('text').textContent = s.text;
  $('count').textContent = String(idx + 1).padStart(2, '0') + ' / ' + S.length;
  cv.setAttribute('aria-label', s.title + ' animation. ' + s.text);
  [...dotsEl.children].forEach((d, k) => d.setAttribute('aria-current', k === idx ? 'true' : 'false'));
  try { history.replaceState(null, '', '#s' + (idx + 1)); } catch (e) {}
}
$('prev').addEventListener('click', () => go(idx - 1));
$('next').addEventListener('click', () => go(idx + 1));
$('replay').addEventListener('click', () => { ct = 0; fade = 0; if (paused) { paused = false; syncPause(); } });
$('pp').addEventListener('click', () => { paused = !paused; syncPause(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx + 1); else if (e.key === 'ArrowLeft') go(idx - 1);
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); paused = !paused; syncPause(); }
});
let px0 = null;
const dev = $('screenWrap');
dev.addEventListener('pointerdown', e => { px0 = [e.clientX, e.clientY]; });
dev.addEventListener('pointerup', e => {
  if (!px0) return; const dx = e.clientX - px0[0], dy = e.clientY - px0[1]; px0 = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) go(idx + (dx < 0 ? 1 : -1));
  else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { paused = !paused; syncPause(); }
});
dev.addEventListener('pointercancel', () => { px0 = null; });
window.addEventListener('hashchange', () => { const m = /^#s(\d+)$/.exec(location.hash); if (m && +m[1] - 1 !== idx) go(+m[1] - 1); });

function fit() {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d)); sx = cv.width / W;
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(cv); window.addEventListener('resize', fit);

let bgGrad = null, warned = false;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) ct += dt;
  fade = Math.min(1, fade + dt / .35);
  ctx.setTransform(sx, 0, 0, sx, 0, 0);
  if (!bgGrad) { bgGrad = ctx.createLinearGradient(0, 0, 0, H); bgGrad.addColorStop(0, '#0b1124'); bgGrad.addColorStop(1, '#080c18'); }
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  const s = S[idx];
  try { s.draw(ct % s.L); } catch (err) { if (!warned) { warned = true; console.error(err); } ctx.globalAlpha = 1; ctx.setLineDash([]); }
  if (fade < 1) { ctx.fillStyle = 'rgba(8,12,24,' + (1 - fade) + ')'; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

fit(); syncPause();
{ const m = /^#s(\d+)$/.exec(location.hash); go(m ? clamp(+m[1] - 1, 0, S.length - 1) : 0); }
requestAnimationFrame(frame);
})();
</script>
</body>
